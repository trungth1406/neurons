[package]
name = "neuron"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# serde-1 is owner-pinned (spec #1); rejected for persistence per ADR-0001
petgraph = { version = "0.8.3", features = ["stable_graph", "serde-1"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[[bin]]
name = "neuron"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"
